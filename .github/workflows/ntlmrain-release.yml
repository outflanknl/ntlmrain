name: ntlmrain release

on:
  workflow_dispatch:
  push:
    tags:
      - "ntlmrain-v*"

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            executable: ntlmrain.exe
            artifact: ntlmrain-windows-x86_64
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            executable: ntlmrain
            artifact: ntlmrain-linux-x86_64
          - os: macos-13
            target: x86_64-apple-darwin
            executable: ntlmrain
            artifact: ntlmrain-macos-x86_64
          - os: macos-14
            target: aarch64-apple-darwin
            executable: ntlmrain
            artifact: ntlmrain-macos-aarch64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Test
        run: cargo test --locked
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Stage archive
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.executable }}" package/
          Copy-Item README.md package/
          Copy-Item LICENSE package/
          Copy-Item RESPONSIBLE_USE.md package/
          Copy-Item THIRD_PARTY_NOTICES.txt package/
          Compress-Archive -Path package/* -DestinationPath "${{ matrix.artifact }}.zip"
          (Get-FileHash "${{ matrix.artifact }}.zip" -Algorithm SHA256).Hash.ToLower() + "  ${{ matrix.artifact }}.zip" | Set-Content "${{ matrix.artifact }}.zip.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.zip
            ${{ matrix.artifact }}.zip.sha256
