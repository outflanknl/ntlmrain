[package]
name = "ntlmrain"
version = "0.1.17"
edition = "2024"
description = "Standalone NetNTLMv1 rainbow-table recovery CLI"
repository = "https://github.com/outflanknl/ntlmrain"
license = "Apache-2.0"

[dependencies]
anyhow = "1"
bytemuck = { version = "1", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4", features = ["derive", "env"] }
directories = "6"
hex = "0.4"
memmap2 = "0.9"
pollster = "0.4"
rand = "0.9"
rayon = "1.10"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
toml = "0.9"
wgpu = { version = "25", default-features = true }

[target.'cfg(target_arch = "x86_64")'.dependencies]
fast-des = "0.8"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"

[[bin]]
name = "ntlmrain"
path = "src/main.rs"
